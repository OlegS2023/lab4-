global:
  scrape_interval: 5s  # Jak często Prometheus zbiera dane

scrape_configs:
  # FastAPI - metryki aplikacji
  - job_name: 'fastapi'
    metrics_path: /metrics
    static_configs:
      - targets: ['fastapi:8000']

  # OpenTelemetry Collector - metryki
  - job_name: 'otel-collector'
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']

  # Pushgateway - metryki z k6
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
