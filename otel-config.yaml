receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318   # odbiór HTTP
      grpc:
        endpoint: 0.0.0.0:4316   # odbiór gRPC

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

  otlp:
    endpoint: tempo:4317        # wysyłka do Tempo (HTTP)
    tls:
      insecure: true

  debug:
    verbosity: detailed

  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki] #loki mozna zmienic
